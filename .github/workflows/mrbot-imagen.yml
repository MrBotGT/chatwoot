# Imagen de Chatwoot para Mr. Bot Salud: la edición comunitaria con nuestra marca (ver MRBOT.md). Se publica en GHCR
# con cada tag v<versión de Chatwoot>-mrbot.<n>; el servidor de soporte usa esa imagen fijada por su digest.
# Los workflows de Chatwoot se sacaron: publican en su Docker Hub con sus claves.
name: Imagen Mr. Bot

on:
  push:
    tags: ['v*-mrbot.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Construir y publicar (amd64, como el servidor de soporte)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest
        run: echo "${{ env.IMAGEN }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
